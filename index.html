<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Smart Home Cloud Dash</title>
    <!-- CDN এর মাধ্যমে MQTT লাইব্রেরি যুক্ত করা হলো -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        /* আপনার আগের সেই চমৎকার ডার্ক থিম স্টাইল এখানে হুবহু থাকবে */
        * {margin:0; padding:0; box-sizing:border-box;}
        body {background:#0f172a; font-family:'Segoe UI', sans-serif; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
        .container {width:100%; max-width:420px; display:flex; flex-direction:column; gap:15px;}
        .header {text-align:center; font-size:24px; font-weight:bold; color:#60a5fa;}
        .card {background:#1e293b; border-radius:16px; padding:20px; box-shadow:0 8px 32px rgba(0,0,0,0.4);}
        .card-title {font-size:16px; font-weight:600; margin-bottom:15px; color:#60a5fa;}
        .button-group {display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0;}
        button {padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; background:#475569; color:#94a3b8; text-transform:uppercase;}
        .active-on {background:#22c55e !important; color:white !important;}
        .active-off {background:#ef4444 !important; color:white !important;}
        .status {text-align:center; font-size:14px; color:#e2e8f0; margin-top:5px;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">Smart Home Cloud</div>
    
    <!-- Fan Card -->
    <div class="card">
        <div class="card-title">Fan Control</div>
        <div class="status" id="fanStatus">Connecting to Cloud...</div>
        <div class="button-group">
            <button id="btnFanOn" onclick="sendMqttCmd('FAN_ON')">On</button>
            <button id="btnFanOff" onclick="sendMqttCmd('FAN_OFF')">Off</button>
        </div>
        <div class="button-group">
            <button onclick="sendMqttCmd('FAN_UP')">Speed +</button>
            <button onclick="sendMqttCmd('FAN_DOWN')">Speed -</button>
        </div>
    </div>

    <!-- Lights Card -->
    <div class="card">
        <div class="card-title">Lights Control</div>
        <p id="light1Status" style="font-size:14px; margin-bottom:5px;">Light 1: OFF</p>
        <div class="button-group">
            <button id="btnL1On" onclick="sendMqttCmd('L1_ON')">On</button>
            <button id="btnL1Off" onclick="sendMqttCmd('L1_OFF')">Off</button>
        </div>
        <br>
        <p id="light2Status" style="font-size:14px; margin-bottom:5px;">Light 2: OFF</p>
        <div class="button-group">
            <button id="btnL2On" onclick="sendMqttCmd('L2_ON')">On</button>
            <button id="btnL2Off" onclick="sendMqttCmd('L2_OFF')">Off</button>
        </div>
    </div>
</div>

<script>
// 💡 আপনার HiveMQ Cloud ক্লাস্টার লিংক, পোর্ট ৮৮৮৪ এবং ইউজারনেম/পাসওয়ার্ড বসান
const client = new Paho.MQTT.Client("xxxxxxxx.s1.eu.hivemq.cloud", 8884, "web_client_" + parseInt(Math.random() * 100, 10));

client.onConnectionLost = onConnectionLost;
client.onMessageArrived = onMessageArrived;

// সিকিউরিটি প্যারামিটার যুক্ত করা হলো
client.connect({
    onSuccess: onConnect,
    useSSL: true, // সিকিউর কানেকশন এনশিওর করতে
    userName: "hivemq.webclient.1780157127447", 
    password: "g0S.jm,41XHU7T;cMro?"
});

function onConnect() {
    console.log("Connected Securely via WebSockets!");
    document.getElementById("fanStatus").textContent = "Connected Securely to Cloud";
    client.subscribe("myuniquehome/status");
}

function onConnectionLost(responseObject) {
    if (responseObject.errorCode !== 0) {
        document.getElementById("fanStatus").textContent = "Connection Lost! Retrying...";
        setTimeout(() => client.connect({onSuccess: onConnect, useSSL: true, userName: "YOUR_MQTT_USERNAME", password: "YOUR_MQTT_PASSWORD"}), 5000);
    }
}

function onMessageArrived(message) {
    // আগের UI আপডেটের লজিক এখানে হুবহু অপরিবর্তিত থাকবে...
}

function sendMqttCmd(cmd) {
    const message = new Paho.MQTT.Message(cmd);
    message.destinationName = "myuniquehome/control";
    client.send(message);
}
</script>
</body>
</html>
