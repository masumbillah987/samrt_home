<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Smart Home Control</title>
    <!-- Paho MQTT WebSockets Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        body { background: #0f172a; font-family: sans-serif; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: #1e293b; padding: 20px; border-radius: 15px; }
        .status { text-align: center; padding: 10px; margin-bottom: 20px; border-radius: 8px; font-size: 13px; background: #334155; }
        .online { color: #22c55e; }
        .offline { color: #ef4444; }
        button { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-on { background: #22c55e; }
        .btn-off { background: #ef4444; }
        .card { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        h3 { margin-bottom: 10px; color: #60a5fa; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Smart Home</h2>
    <div id="status" class="status offline">Connecting...</div>

    <div class="card">
        <h3>Fan Control</h3>
        <button class="btn-on" onclick="sendMQTT('FAN_ON')">FAN ON</button>
        <button class="btn-off" onclick="sendMQTT('FAN_OFF')">FAN OFF</button>
    </div>

    <div class="card">
        <h3>Lights Control</h3>
        <button class="btn-on" onclick="sendMQTT('L1_ON')">LIGHT 1 ON</button>
        <button class="btn-off" onclick="sendMQTT('L1_OFF')">LIGHT 1 OFF</button>
        <button class="btn-on" onclick="sendMQTT('L2_ON')">LIGHT 2 ON</button>
        <button class="btn-off" onclick="sendMQTT('L2_OFF')">LIGHT 2 OFF</button>
    </div>
</div>

<script>
    // HiveMQ পাবলিক ব্রোকারের কনফিগারেশন (SSL/WSS)
    const MQTT_HOST = "broker.hivemq.com";
    const MQTT_PORT = 8884; // SSL পোর্ট
    const CLIENT_ID = "web_" + Math.random().toString(16).substr(2, 8);
    
    const client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, CLIENT_ID);

    client.onConnectionLost = () => {
        document.getElementById('status').textContent = "DISCONNECTED";
        document.getElementById('status').className = "status offline";
    };

    client.connect({
        useSSL: true, // SSL এনাবল করা হয়েছে
        onSuccess: () => {
            document.getElementById('status').textContent = "ONLINE (SECURE)";
            document.getElementById('status').className = "status online";
            client.subscribe("myuniquehome/status");
        },
        onFailure: (err) => {
            document.getElementById('status').textContent = "FAILED: " + err.errorMessage;
        }
    });

    function sendMQTT(cmd) {
        if(client.isConnected()) {
            let message = new Paho.MQTT.Message(cmd);
            message.destinationName = "myuniquehome/control";
            client.send(message);
        } else {
            alert("Not connected!");
        }
    }
</script>

</body>
</html>
