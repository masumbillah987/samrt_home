<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Smart Home Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0f172a; font-family:'Segoe UI', sans-serif; color:#fff; display:flex; justify-content:center; padding:20px; }
        .container { width:100%; max-width:400px; background:#1e293b; padding:20px; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,0.5); }
        .status-bar { text-align:center; padding:10px; margin-bottom:20px; border-radius:8px; font-weight:bold; font-size:13px; background:#334155; }
        .connected { color:#22c55e; }
        .disconnected { color:#ef4444; }
        .card { background:#0f172a; padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #334155; }
        .card-title { color:#60a5fa; font-weight:600; margin-bottom:10px; }
        .button-group { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        button { padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; color:white; transition:0.3s; text-transform:uppercase; }
        .btn-on { background:#475569; }
        .btn-off { background:#475569; }
        .active-on { background:#22c55e !important; }
        .active-off { background:#ef4444 !important; }
        .slider-container { margin-top:15px; }
        input[type=range] { width:100%; cursor:pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; margin-bottom:15px;">Smart Home</h2>
    <div id="connectionStatus" class="status-bar disconnected">CONNECTING...</div>

    <div class="card">
        <div class="card-title" id="fanStatusText">Fan: OFF</div>
        <div class="button-group">
            <button id="btnFanOn" class="btn-on" onclick="sendMQTT('FAN_ON')">On</button>
            <button id="btnFanOff" class="btn-off" onclick="sendMQTT('FAN_OFF')">Off</button>
        </div>
        <div class="slider-container">
            <input type="range" id="fanSlider" min="0" max="100" value="50" disabled>
        </div>
    </div>

    <div class="card">
        <div class="card-title" id="l1StatusText">Light 1: OFF</div>
        <div class="button-group">
            <button id="btnL1On" class="btn-on" onclick="sendMQTT('L1_ON')">On</button>
            <button id="btnL1Off" class="btn-off" onclick="sendMQTT('L1_OFF')">Off</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title" id="l2StatusText">Light 2: OFF</div>
        <div class="button-group">
            <button id="btnL2On" class="btn-on" onclick="sendMQTT('L2_ON')">On</button>
            <button id="btnL2Off" class="btn-off" onclick="sendMQTT('L2_OFF')">Off</button>
        </div>
    </div>
</div>

<script>
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + Math.random().toString(16).substr(2, 8));

    client.onConnectionLost = () => {
        document.getElementById("connectionStatus").textContent = "DISCONNECTED";
        document.getElementById("connectionStatus").className = "status-bar disconnected";
    };

    client.onMessageArrived = (message) => {
        const data = JSON.parse(message.payloadString);
        
        // Update UI
        document.getElementById('fanStatusText').textContent = "Fan: " + (data.fanEnabled ? "ON" : "OFF");
        document.getElementById('l1StatusText').textContent = "Light 1: " + (data.light1State ? "ON" : "OFF");
        document.getElementById('l2StatusText').textContent = "Light 2: " + (data.light2State ? "ON" : "OFF");
        
        document.getElementById('btnFanOn').className = data.fanEnabled ? "btn-on active-on" : "btn-on";
        document.getElementById('btnFanOff').className = !data.fanEnabled ? "btn-off active-off" : "btn-off";
        
        document.getElementById('btnL1On').className = data.light1State ? "btn-on active-on" : "btn-on";
        document.getElementById('btnL1Off').className = !data.light1State ? "btn-off active-off" : "btn-off";
        
        document.getElementById('btnL2On').className = data.light2State ? "btn-on active-on" : "btn-on";
        document.getElementById('btnL2Off').className = !data.light2State ? "btn-off active-off" : "btn-off";
    };

    client.connect({
        useSSL: true,
        onSuccess: () => {
            document.getElementById("connectionStatus").textContent = "ONLINE (SECURE)";
            document.getElementById("connectionStatus").className = "status-bar connected";
            client.subscribe("myuniquehome/status");
        }
    });

    function sendMQTT(cmd) {
        if(client.isConnected()) {
            let message = new Paho.MQTT.Message(cmd);
            message.destinationName = "myuniquehome/control";
            client.send(message);
        }
    }
</script>
</body>
</html>
