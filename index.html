<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Smart Home Pro | Status Refresh</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0f172a 100%);
            color: #fff;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 30% 50%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(34, 197, 94, 0.05) 0%, transparent 60%);
            animation: floatBg 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(2%, 1%) rotate(2deg); }
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 24px 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-glow h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #fef08a, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(51, 65, 85, 0.7);
            backdrop-filter: blur(8px);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: 0.2s;
        }

        .icon-btn:active { transform: scale(0.95); }
        .status-btn { background: rgba(34, 197, 94, 0.8); }
        .login-header-btn { background: rgba(245, 158, 11, 0.9); }
        .logout-btn { background: rgba(239, 68, 68, 0.8); }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #7dd3fc;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid #38bdf8;
            padding-left: 12px;
        }

        .fan-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .fan-icon {
            width: 90px;
            height: 90px;
            fill: #475569;
            transition: all 0.2s;
        }

        .spinning {
            animation: spinFan 0.7s linear infinite;
            fill: #22c55e !important;
            filter: drop-shadow(0 0 8px #22c55e);
        }

        @keyframes spinFan {
            100% { transform: rotate(360deg); }
        }

        .status-text {
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            background: #0f172a80;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            width: auto;
            margin: 8px auto;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0 8px;
        }

        .ctrl-btn {
            padding: 12px;
            border-radius: 50px;
            font-weight: 700;
            background: #334155;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.15s;
        }

        .ctrl-btn:active { transform: scale(0.96); }
        .active-on { background: #22c55e !important; box-shadow: 0 0 12px rgba(34,197,94,0.5); }
        .active-off { background: #ef4444 !important; box-shadow: 0 0 12px rgba(239,68,68,0.4); }

        .light-item {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 24px;
            padding: 14px;
            margin-top: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid #334155;
        }

        .light-label {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .light-glow { color: #fbbf24; text-shadow: 0 0 6px #f59e0b; }

        .slider-container {
            margin-top: 12px;
            padding: 8px 0;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        input[type="range"] {
            width: 100%;
            height: 5px;
            border-radius: 10px;
            background: #334155;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #22c55e;
            cursor: pointer;
            box-shadow: 0 0 6px #22c55e;
            border: 2px solid white;
        }
        input:disabled, .ctrl-btn:disabled, .icon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .server-status {
            text-align: center;
            font-size: 12px;
            padding: 10px;
            margin-top: 16px;
            border-radius: 60px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .status-badge {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .badge-online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .badge-offline { background: #ef4444; }
        @keyframes pulse {
            0%,100%{ opacity:1; transform:scale(1); }
            50%{ opacity:0.6; transform:scale(1.2); }
        }

        /* Modal Login Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .login-modal {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 32px;
            padding: 28px 24px;
            width: calc(100% - 40px);
            max-width: 380px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .login-modal .header {
            font-size: 28px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            margin-left: 8px;
        }
        .login-modal input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #334155;
            border-radius: 60px;
            font-size: 15px;
            color: white;
        }
        .login-modal input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 60px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }
        .modal-login-btn {
            background: linear-gradient(95deg, #f59e0b, #d97706);
            color: white;
        }
        .modal-cancel-btn {
            background: #334155;
            color: white;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #facc15;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 500;
            z-index: 1100;
            backdrop-filter: blur(12px);
            border-left: 3px solid #facc15;
            pointer-events: none;
            animation: toastFade 2.2s ease forwards;
        }
        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 20px 16px; }
            .title-glow h1 { font-size: 22px; }
            .icon-btn { padding: 6px 10px; font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="dashboardView">
        <div class="dashboard-header">
            <div class="title-glow"><h1>⚡ Smart Control</h1></div>
            <div class="action-buttons">
                <button class="icon-btn status-btn" id="currentStatusBtn">📊 Current Status</button>
                <button class="icon-btn login-header-btn" id="showLoginBtn">🔐 Login</button>
            </div>
        </div>
        
        <!-- Fan Card -->
        <div class="card">
            <div class="card-title">🌀 Fan Commander</div>
            <div class="fan-container">
                <svg id="fanIcon" class="fan-icon" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="7" fill="white"/>
                    <path d="M50 10 Q70 30 50 50 Q30 30 50 10"/>
                    <path d="M90 50 Q70 70 50 50 Q70 30 90 50"/>
                    <path d="M50 90 Q30 70 50 50 Q70 70 50 90"/>
                    <path d="M10 50 Q30 30 50 50 Q30 70 10 50"/>
                </svg>
            </div>
            <div class="status-text" id="fanStatusText">⏹️ Fan is OFF</div>
            <div class="button-group">
                <button class="ctrl-btn" id="fanOnBtn" disabled>TURN ON</button>
                <button class="ctrl-btn active-off" id="fanOffBtn" disabled>TURN OFF</button>
            </div>
            <div class="slider-container">
                <div class="slider-label"><span>🌀 Speed</span><span id="speedPercent">50%</span></div>
                <input type="range" id="fanSpeedSlider" min="0" max="100" value="50" disabled>
            </div>
        </div>
        
        <!-- Lights Card -->
        <div class="card">
            <div class="card-title">💡 Illumination Hub</div>
            <div class="light-item">
                <div class="light-label" id="light1Label">🏠 Living Light : OFF</div>
                <div class="button-group">
                    <button class="ctrl-btn" id="light1OnBtn" disabled>ON</button>
                    <button class="ctrl-btn active-off" id="light1OffBtn" disabled>OFF</button>
                </div>
            </div>
            <div class="light-item">
                <div class="light-label" id="light2Label">🛌 Bedroom Light : OFF</div>
                <div class="button-group">
                    <button class="ctrl-btn" id="light2OnBtn" disabled>ON</button>
                    <button class="ctrl-btn active-off" id="light2OffBtn" disabled>OFF</button>
                </div>
            </div>
        </div>
        
        <div class="server-status" id="serverStatus">
            <span class="status-badge badge-offline" id="statusLed"></span>
            <span id="statusMessage">🔴 Not logged in</span>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
    <div class="login-modal">
        <div class="header" style="font-size: 26px; margin-bottom: 10px;">🔐 Access Control</div>
        <div class="subhead" style="margin-bottom: 20px;">Enter your credentials</div>
        <div class="form-group">
            <label>👤 User ID</label>
            <input type="text" id="modalUserId" placeholder="Your User ID" autocomplete="off">
        </div>
        <div class="form-group">
            <label>🔒 Password</label>
            <input type="text" id="modalPassword" placeholder="Password" autocomplete="off">
        </div>
        <div class="modal-buttons">
            <button class="modal-cancel-btn" id="cancelLoginBtn">Cancel</button>
            <button class="modal-login-btn" id="confirmLoginBtn">Connect</button>
        </div>
    </div>
</div>

<script>
    // ======================= MQTT & STATE =======================
    let mqttClient = null;
    let isConnected = false;
    let reconnectTimer = null;
    let currentState = {
        fanEnabled: false,
        fanSpeed: 50,
        light1State: false,
        light2State: false
    };
    let runtimeTopics = { statusTopic: "", controlTopic: "" };
    
    // DOM elements
    const showLoginBtn = document.getElementById('showLoginBtn');
    const currentStatusBtn = document.getElementById('currentStatusBtn');
    const loginModal = document.getElementById('loginModal');
    const modalUserId = document.getElementById('modalUserId');
    const modalPassword = document.getElementById('modalPassword');
    const confirmLoginBtn = document.getElementById('confirmLoginBtn');
    const cancelLoginBtn = document.getElementById('cancelLoginBtn');
    
    const fanOnBtn = document.getElementById('fanOnBtn');
    const fanOffBtn = document.getElementById('fanOffBtn');
    const fanSlider = document.getElementById('fanSpeedSlider');
    const light1On = document.getElementById('light1OnBtn');
    const light1Off = document.getElementById('light1OffBtn');
    const light2On = document.getElementById('light2OnBtn');
    const light2Off = document.getElementById('light2OffBtn');
    
    // Helper functions
    function showMessage(text, isError = false, duration = 2500) {
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = text;
        toast.style.borderLeftColor = isError ? '#ef4444' : '#22c55e';
        toast.style.color = isError ? '#fecaca' : '#bef264';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), duration);
    }
    
    function updateDashboardUI() {
        const fanIcon = document.getElementById('fanIcon');
        const fanStatusSpan = document.getElementById('fanStatusText');
        if (currentState.fanEnabled) {
            fanIcon.classList.add('spinning');
            fanStatusSpan.innerHTML = '🌀 Fan is RUNNING';
            fanOnBtn.classList.add('active-on');
            fanOffBtn.classList.remove('active-off');
            fanSlider.disabled = false;
        } else {
            fanIcon.classList.remove('spinning');
            fanStatusSpan.innerHTML = '⏹️ Fan is OFF';
            fanOnBtn.classList.remove('active-on');
            fanOffBtn.classList.add('active-off');
            fanSlider.disabled = true;
        }
        fanSlider.value = currentState.fanSpeed;
        document.getElementById('speedPercent').innerText = currentState.fanSpeed + '%';
        
        const l1label = document.getElementById('light1Label');
        if (currentState.light1State) {
            l1label.innerHTML = '🏠 Living Light : ON ✨';
            l1label.classList.add('light-glow');
            light1On.classList.add('active-on');
            light1Off.classList.remove('active-off');
        } else {
            l1label.innerHTML = '🏠 Living Light : OFF';
            l1label.classList.remove('light-glow');
            light1On.classList.remove('active-on');
            light1Off.classList.add('active-off');
        }
        
        const l2label = document.getElementById('light2Label');
        if (currentState.light2State) {
            l2label.innerHTML = '🛌 Bedroom Light : ON ✨';
            l2label.classList.add('light-glow');
            light2On.classList.add('active-on');
            light2Off.classList.remove('active-off');
        } else {
            l2label.innerHTML = '🛌 Bedroom Light : OFF';
            l2label.classList.remove('light-glow');
            light2On.classList.remove('active-on');
            light2Off.classList.add('active-off');
        }
    }
    
    function enableControls(enabled) {
        const btns = [fanOnBtn, fanOffBtn, light1On, light1Off, light2On, light2Off, currentStatusBtn];
        btns.forEach(btn => { if(btn) btn.disabled = !enabled; });
        if (enabled && currentState.fanEnabled) fanSlider.disabled = false;
        else if (!enabled) fanSlider.disabled = true;
        
        const loginHeaderBtn = document.getElementById('showLoginBtn');
        if (enabled) {
            loginHeaderBtn.textContent = "🚪 Logout";
            loginHeaderBtn.classList.remove('login-header-btn');
            loginHeaderBtn.classList.add('logout-btn');
            loginHeaderBtn.onclick = () => performLogout();
        } else {
            loginHeaderBtn.textContent = "🔐 Login";
            loginHeaderBtn.classList.remove('logout-btn');
            loginHeaderBtn.classList.add('login-header-btn');
            loginHeaderBtn.onclick = () => { loginModal.classList.add('active'); };
        }
    }
    
    function updateServerStatus(online, msg) {
        const led = document.getElementById('statusLed');
        const statusSpan = document.getElementById('statusMessage');
        if (online) {
            led.className = 'status-badge badge-online';
            statusSpan.innerText = msg || '🟢 Server · Live';
        } else {
            led.className = 'status-badge badge-offline';
            statusSpan.innerText = msg || '🔴 Not connected';
        }
    }
    
    function onMessageArrived(message) {
        try {
            const payload = message.payloadString;
            if (payload.startsWith('{')) {
                const data = JSON.parse(payload);
                if (typeof data.fanEnabled !== 'undefined') currentState.fanEnabled = data.fanEnabled;
                if (typeof data.fanSpeed !== 'undefined') currentState.fanSpeed = data.fanSpeed;
                if (typeof data.light1State !== 'undefined') currentState.light1State = data.light1State;
                if (typeof data.light2State !== 'undefined') currentState.light2State = data.light2State;
                updateDashboardUI();
                localStorage.setItem('deviceState', JSON.stringify(currentState));
            }
        } catch(e) { console.warn(e); }
    }
    
    function onConnectionLost() {
        isConnected = false;
        updateServerStatus(false, '🔴 Connection lost');
        enableControls(false);
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
            if (runtimeTopics.statusTopic && runtimeTopics.controlTopic) establishConnection();
        }, 4000);
    }
    
    function sendCommand(cmd) {
        if (!mqttClient || !isConnected) {
            showMessage("Not connected. Please login.", true);
            return false;
        }
        try {
            let msg = new Paho.MQTT.Message(cmd);
            msg.destinationName = runtimeTopics.controlTopic;
            mqttClient.send(msg);
            return true;
        } catch(e) { return false; }
    }
    
    function establishConnection() {
        if (!runtimeTopics.statusTopic || !runtimeTopics.controlTopic) return;
        if (mqttClient) {
            try { mqttClient.disconnect(); } catch(e) {}
            mqttClient = null;
        }
        const clientId = "ctrl_" + Math.random().toString(36).substring(2, 10);
        mqttClient = new Paho.MQTT.Client("broker.hivemq.com", 8884, clientId);
        mqttClient.onMessageArrived = onMessageArrived;
        mqttClient.onConnectionLost = onConnectionLost;
        
        mqttClient.connect({
            useSSL: true,
            timeout: 8,
            onSuccess: () => {
                isConnected = true;
                updateServerStatus(true, '🟢 Server · Live');
                mqttClient.subscribe(runtimeTopics.statusTopic, { qos: 0 });
                sendCommand("REFRESH_STATE");
                sendCommand("GET_STATUS");
                showMessage("✅ Device state saved & synced", false);
                enableControls(true);
                updateDashboardUI();
            },
            onFailure: (err) => {
                console.warn("Connection failed", err);
                isConnected = false;
                updateServerStatus(false, '🔴 Connection failed');
                enableControls(false);
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => establishConnection(), 5000);
            }
        });
    }
    
    // Save login credentials & state to localStorage
    function saveLoginCredentials(userId, password) {
        localStorage.setItem('smartHomeUserId', userId);
        localStorage.setItem('smartHomePassword', password);
    }
    
    function clearSavedCredentials() {
        localStorage.removeItem('smartHomeUserId');
        localStorage.removeItem('smartHomePassword');
        localStorage.removeItem('deviceState');
    }
    
    function loadSavedCredentials() {
        const userId = localStorage.getItem('smartHomeUserId');
        const pwd = localStorage.getItem('smartHomePassword');
        if (userId && pwd) {
            modalUserId.value = userId;
            modalPassword.value = pwd;
            return { userId, pwd };
        }
        return null;
    }
    
    function loadDeviceState() {
        const savedState = localStorage.getItem('deviceState');
        if (savedState) {
            try {
                const parsed = JSON.parse(savedState);
                currentState = { ...currentState, ...parsed };
                updateDashboardUI();
            } catch(e) {}
        }
    }
    
    function performLogin() {
        const userId = modalUserId.value.trim();
        const pwd = modalPassword.value.trim();
        if (!userId || !pwd) {
            showMessage("Please enter User ID and Password", true);
            return;
        }
        runtimeTopics.statusTopic = userId;
        runtimeTopics.controlTopic = pwd;
        saveLoginCredentials(userId, pwd);
        loginModal.classList.remove('active');
        showMessage("Connecting to server...", false);
        if (mqttClient) { try { mqttClient.disconnect(); } catch(e) {} }
        mqttClient = null;
        isConnected = false;
        enableControls(false);
        updateServerStatus(false, '🔄 Connecting...');
        establishConnection();
    }
    
    function performLogout() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        if (mqttClient && mqttClient.isConnected()) {
            try { mqttClient.disconnect(); } catch(e) {}
        }
        mqttClient = null;
        isConnected = false;
        runtimeTopics = { statusTopic: "", controlTopic: "" };
        enableControls(false);
        updateServerStatus(false, '🔴 Not logged in');
        currentState = { fanEnabled: false, fanSpeed: 50, light1State: false, light2State: false };
        updateDashboardUI();
        clearSavedCredentials();
        showMessage("Logged out successfully", false);
    }
    
    function requestCurrentStatus() {
        if (!isConnected) {
            showMessage("Not connected. Please login first.", true);
            return;
        }
        sendCommand("REFRESH_STATE");
        sendCommand("GET_STATUS");
        showMessage("📡 Fetching latest device status...", false);
        // Also show a summary in a toast after a short delay (optional)
        setTimeout(() => {
            if (isConnected) {
                const fanState = currentState.fanEnabled ? "ON" : "OFF";
                const light1State = currentState.light1State ? "ON" : "OFF";
                const light2State = currentState.light2State ? "ON" : "OFF";
                showMessage(`Fan: ${fanState} | Speed: ${currentState.fanSpeed}% | Living: ${light1State} | Bedroom: ${light2State}`, false, 3000);
            }
        }, 500);
    }
    
    function attemptAutoLogin() {
        const saved = loadSavedCredentials();
        if (saved) {
            runtimeTopics.statusTopic = saved.userId;
            runtimeTopics.controlTopic = saved.pwd;
            showMessage("Auto-login in progress...", false);
            establishConnection();
        } else {
            enableControls(false);
            updateServerStatus(false, '🔐 Login to start');
        }
    }
    
    function attachControlEvents() {
        fanOnBtn.onclick = () => { sendCommand('FAN_ON'); showMessage("Fan ON requested"); };
        fanOffBtn.onclick = () => { sendCommand('FAN_OFF'); showMessage("Fan OFF requested"); };
        fanSlider.onchange = (e) => { sendCommand('SPEED_' + e.target.value); showMessage(`Speed ${e.target.value}%`); };
        light1On.onclick = () => { sendCommand('L1_ON'); showMessage("Living Light ON"); };
        light1Off.onclick = () => { sendCommand('L1_OFF'); showMessage("Living Light OFF"); };
        light2On.onclick = () => { sendCommand('L2_ON'); showMessage("Bedroom Light ON"); };
        light2Off.onclick = () => { sendCommand('L2_OFF'); showMessage("Bedroom Light OFF"); };
        currentStatusBtn.onclick = requestCurrentStatus;
    }
    
    // Modal handlers
    showLoginBtn.onclick = () => { loginModal.classList.add('active'); };
    cancelLoginBtn.onclick = () => { loginModal.classList.remove('active'); };
    confirmLoginBtn.onclick = performLogin;
    loginModal.onclick = (e) => { if (e.target === loginModal) loginModal.classList.remove('active'); };
    
    // Slider live preview
    fanSlider.oninput = (e) => { document.getElementById('speedPercent').innerText = e.target.value + '%'; };
    
    // Initialize
    window.addEventListener('load', () => {
        attachControlEvents();
        loadDeviceState();
        updateDashboardUI();
        attemptAutoLogin();
    });
</script>
</body>
</html>
