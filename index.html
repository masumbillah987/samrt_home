<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Smart Home Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --on: #22c55e; --off: #ef4444; }
        * {margin:0; padding:0; box-sizing:border-box;}
        html, body { width: 100%; height: 100%; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 0; }
        
        .container { width: 100%; height: 100vh; max-width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .header { text-align: center; font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 5px; flex-shrink: 0; }
        .card { background: var(--card); padding: 15px; border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); flex-shrink: 0; }
        .card-title { font-size: 14px; font-weight: 600; color: #60a5fa; margin-bottom: 12px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #334155; color: white; transition: 0.3s; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        button:active { transform: scale(0.95); }
        .active-on { background: var(--on) !important; box-shadow: 0 0 15px rgba(34,197,94,0.4) !important; }
        .active-off { background: var(--off) !important; box-shadow: 0 0 15px rgba(239,68,68,0.4) !important; }
        
        /* FAN ANIMATIONS */
        .fan-container { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        .fan-icon { width: 70px; height: 70px; fill: #475569; transition: fill 0.3s ease; }
        .spinning { animation: spin 0.8s linear infinite; fill: var(--on) !important; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* LIGHT ANIMATIONS */
        .light-item { background: #0f172a; border-radius: 10px; padding: 10px; margin: 6px 0; border: 1px solid #334155; }
        .light-label { font-size: 13px; font-weight: 600; color: #e2e8f0; margin-bottom: 6px; transition: color 0.3s; }
        .light-glow { color: #fbbf24 !important; text-shadow: 0 0 10px #fbbf24; }
        
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
        .status-text { text-align: center; font-size: 12px; color: #94a3b8; margin: 8px 0; font-weight: 600; }
        
        .slider-container { padding: 8px 0; display: flex; flex-direction: column; gap: 6px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; }
        input[type=range] { width: 100%; height: 6px; border-radius: 8px; background: #334155; outline: none; -webkit-appearance: none; accent-color: var(--accent); }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #22c55e; cursor: pointer; box-shadow: 0 0 8px rgba(34,197,94,0.5); transition: background 0.3s; }
        input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #22c55e; cursor: pointer; border: none; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
        input[type=range]:disabled { opacity: 0.5; cursor: not-allowed; }

        .connection-status { text-align: center; font-size: 11px; padding: 6px; border-radius: 6px; background: #0f172a; flex-shrink: 0; margin-top: auto; }
        .connected { color: var(--on); }
        .disconnected { color: var(--off); }

        /* LOGIN PAGE STYLES */
        .login-page { display: none; }
        .login-page.active { display: flex; }
        .login-container { width: 100%; height: 100%; max-width: 100%; padding: 15px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; justify-content: center; }
        .login-form { display: flex; flex-direction: column; gap: 10px; }
        input[type="text"] { 
            width: 100%; padding: 11px; border: 2px solid #334155; background: #0f172a; border-radius: 8px; font-size: 14px; transition: 0.3s; color: #fff; 
        }
        input[type="text"]:focus { 
            outline: none; border-color: #60a5fa; box-shadow: 0 0 10px rgba(96, 165, 250, 0.2); 
        }
        input[type="text"]::placeholder {
            color: transparent;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #94a3b8; }
        .login-btn { background: #f59e0b !important; padding: 11px; margin-top: 8px; font-weight: 600; }
        .login-btn:hover { background: #d97706 !important; }
        .logout-btn { background: #ef4444 !important; font-size: 11px; padding: 7px; margin-top: 5px; flex-shrink: 0; }

        .dashboard-page { display: flex; flex-direction: column; gap: 10px; width: 100%; height: 100%; }
        .dashboard-page.hidden { display: none; }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; flex-shrink: 0; gap: 10px; }
        .header-row .header { margin-bottom: 0; }

        @media (max-width: 480px) {
            .container { padding: 8px; gap: 8px; }
            .card { padding: 12px; gap: 8px; }
            .header { font-size: 20px; }
            .button-group { gap: 6px; }
            button { padding: 9px; font-size: 11px; }
            .logout-btn { padding: 6px; font-size: 10px; }
            .fan-icon { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="login-page active" id="loginPage">
    <div class="login-container">
        <h1 class="header">🔐 Smart Home</h1>
        
        <div class="card">
            <div class="card-title">MQTT Config</div>
            
            <div class="login-form">
                <div class="form-group">
                    <label>Status Topic</label>
                    <input type="text" id="statusTopic">
                </div>

                <div class="form-group">
                    <label>Control Topic</label>
                    <input type="text" id="controlTopic">
                </div>

                <button class="login-btn" onclick="connectMQTT()">Connect</button>
            </div>
        </div>

        <div style="text-align: center; font-size: 11px; color: #94a3b8; margin-top: 15px;">
            Configure your MQTT topics
        </div>
    </div>
</div>

<!-- DASHBOARD PAGE -->
<div class="dashboard-page hidden" id="dashboardPage">
    <div class="header-row">
        <h1 class="header">⚙️ Smart Home</h1>
        <button class="logout-btn" onclick="logout()" style="width: 80px;">Logout</button>
    </div>
    
    <!-- FAN CONTROL CARD -->
    <div class="card">
        <div class="card-title">🌬️ Fan Control</div>
        <div class="fan-container">
            <svg id="fanIcon" class="fan-icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="6" fill="white"/>
                <path d="M50 10 Q70 30 50 50 Q30 30 50 10"/>
                <path d="M90 50 Q70 70 50 50 Q70 30 90 50"/>
                <path d="M50 90 Q30 70 50 50 Q70 70 50 90"/>
                <path d="M10 50 Q30 30 50 50 Q30 70 10 50"/>
            </svg>
        </div>
        <div class="status-text" id="fanStatus">Fan is OFF</div>
        <div class="button-group">
            <button id="btnFanOn" onclick="sendMQTT('FAN_ON')">ON</button>
            <button id="btnFanOff" class="active-off" onclick="sendMQTT('FAN_OFF')">OFF</button>
        </div>
        
        <div class="slider-container">
            <div class="slider-label"><span>Speed</span><span id="speedLabel">50%</span></div>
            <input type="range" id="fanSlider" min="0" max="100" value="50" disabled oninput="document.getElementById('speedLabel').textContent = this.value + '%'" onchange="sendMQTT('SPEED_' + this.value)">
        </div>
    </div>

    <!-- LIGHTS CONTROL CARD -->
    <div class="card">
        <div class="card-title">💡 Lights Control</div>
        
        <!-- Light 1 -->
        <div class="light-item">
            <div class="light-label" id="light1Status">🏠 Light 1: OFF</div>
            <div class="button-group">
                <button id="btnL1On" onclick="sendMQTT('L1_ON')">ON</button>
                <button id="btnL1Off" class="active-off" onclick="sendMQTT('L1_OFF')">OFF</button>
            </div>
        </div>

        <!-- Light 2 -->
        <div class="light-item">
            <div class="light-label" id="light2Status">🛏️ Light 2: OFF</div>
            <div class="button-group">
                <button id="btnL2On" onclick="sendMQTT('L2_ON')">ON</button>
                <button id="btnL2Off" class="active-off" onclick="sendMQTT('L2_OFF')">OFF</button>
            </div>
        </div>
    </div>

    <!-- CONNECTION STATUS -->
    <div class="connection-status" id="connectionStatus" class="disconnected">
        🔴 Connecting...
    </div>
</div>

<script>
    let client = null;
    let mqttConfig = {
        broker: "broker.hivemq.com",
        port: 8884,
        statusTopic: "",
        controlTopic: ""
    };

    let currentState = {
        fanEnabled: false,
        fanSpeed: 50,
        light1State: false,
        light2State: false
    };

    // Load saved config from localStorage
    function loadConfig() {
        const saved = localStorage.getItem('mqttConfig');
        if(saved) {
            mqttConfig = JSON.parse(saved);
            document.getElementById('statusTopic').value = mqttConfig.statusTopic;
            document.getElementById('controlTopic').value = mqttConfig.controlTopic;
            connectMQTT();
        }
    }

    // Save config to localStorage
    function saveConfig() {
        localStorage.setItem('mqttConfig', JSON.stringify(mqttConfig));
    }

    // Connect to MQTT
    function connectMQTT() {
        mqttConfig.statusTopic = document.getElementById('statusTopic').value;
        mqttConfig.controlTopic = document.getElementById('controlTopic').value;

        if(!mqttConfig.statusTopic || !mqttConfig.controlTopic) {
            alert('Please fill all fields');
            return;
        }

        client = new Paho.MQTT.Client(
            mqttConfig.broker,
            mqttConfig.port,
            "web_" + Math.random().toString(16).substr(2, 8)
        );

        client.onMessageArrived = (msg) => {
            try {
                const d = JSON.parse(msg.payloadString);
                currentState = {
                    fanEnabled: d.fanEnabled,
                    fanSpeed: d.fanSpeed,
                    light1State: d.light1State,
                    light2State: d.light2State
                };
                updateUI(d);
            } catch(e) {
                console.error('Error parsing MQTT message:', e);
            }
        };

        client.onConnectionLost = (responseObject) => {
            console.log("Connection lost");
            updateConnectionStatus(false);
        };

        client.connect({
            useSSL: true,
            onSuccess: () => {
                console.log("Connected to MQTT");
                updateConnectionStatus(true);
                saveConfig();
                document.getElementById('loginPage').classList.remove('active');
                document.getElementById('dashboardPage').classList.remove('hidden');
                client.subscribe(mqttConfig.statusTopic);
            },
            onFailure: (error) => {
                console.error("Connection failed:", error);
                alert('Failed to connect');
                updateConnectionStatus(false);
            }
        });
    }

    // Logout
    function logout() {
        if(client && client.isConnected()) {
            client.disconnect();
        }
        document.getElementById('dashboardPage').classList.add('hidden');
        document.getElementById('loginPage').classList.add('active');
        updateConnectionStatus(false);
    }

    // Send MQTT Command
    function sendMQTT(cmd) {
        if(!client || !client.isConnected()) {
            alert('Not connected');
            return;
        }
        try {
            let msg = new Paho.MQTT.Message(cmd);
            msg.destinationName = mqttConfig.controlTopic;
            client.send(msg);
        } catch(e) {
            console.error("Error:", e);
        }
    }

    // Update UI
    function updateUI(data) {
        const fanIcon = document.getElementById('fanIcon');
        const fanStatus = document.getElementById('fanStatus');
        const btnFanOn = document.getElementById('btnFanOn');
        const btnFanOff = document.getElementById('btnFanOff');
        
        if(data.fanEnabled) {
            fanIcon.classList.add('spinning');
            fanStatus.textContent = '✅ Fan is ON';
            btnFanOn.classList.add('active-on');
            btnFanOff.classList.remove('active-off');
            document.getElementById('fanSlider').disabled = false;
        } else {
            fanIcon.classList.remove('spinning');
            fanStatus.textContent = '❌ Fan is OFF';
            btnFanOn.classList.remove('active-on');
            btnFanOff.classList.add('active-off');
            document.getElementById('fanSlider').disabled = true;
        }
        
        document.getElementById('fanSlider').value = data.fanSpeed;
        document.getElementById('speedLabel').textContent = data.fanSpeed + '%';

        const l1Icon = document.getElementById('light1Status');
        const btnL1On = document.getElementById('btnL1On');
        const btnL1Off = document.getElementById('btnL1Off');
        
        if(data.light1State) {
            l1Icon.textContent = '🏠 Light 1: ON';
            l1Icon.classList.add('light-glow');
            btnL1On.classList.add('active-on');
            btnL1Off.classList.remove('active-off');
        } else {
            l1Icon.textContent = '🏠 Light 1: OFF';
            l1Icon.classList.remove('light-glow');
            btnL1On.classList.remove('active-on');
            btnL1Off.classList.add('active-off');
        }

        const l2Icon = document.getElementById('light2Status');
        const btnL2On = document.getElementById('btnL2On');
        const btnL2Off = document.getElementById('btnL2Off');
        
        if(data.light2State) {
            l2Icon.textContent = '🛏️ Light 2: ON';
            l2Icon.classList.add('light-glow');
            btnL2On.classList.add('active-on');
            btnL2Off.classList.remove('active-off');
        } else {
            l2Icon.textContent = '🛏️ Light 2: OFF';
            l2Icon.classList.remove('light-glow');
            btnL2On.classList.remove('active-on');
            btnL2Off.classList.add('active-off');
        }
    }

    // Update connection status
    function updateConnectionStatus(connected) {
        const status = document.getElementById('connectionStatus');
        if(connected) {
            status.textContent = '🟢 Connected';
            status.className = 'connection-status connected';
        } else {
            status.textContent = '🔴 Disconnected';
            status.className = 'connection-status disconnected';
        }
    }

    // Initialize
    window.addEventListener('load', () => {
        loadConfig();
    });
</script>
</body>
</html>
