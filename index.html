<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Global Smart Home</title>
    <style>
        /* আপনার লোকালহোস্টের হুবহু স্টাইল এখানে দেওয়া হয়েছে */
        * {margin:0; padding:0; box-sizing:border-box;}
        body {background:#0f172a; font-family:'Segoe UI', Arial, sans-serif; color:#fff; display:flex; justify-content:center; align-items:center; padding:10px; min-height:100vh;}
        .container {width:100%; max-width:420px; display:flex; flex-direction:column; gap:15px;}
        .header {text-align:center; font-size:24px; font-weight:bold; color:#fff;}
        .card {background:#1e293b; border-radius:16px; padding:20px; box-shadow:0 8px 32px rgba(0,0,0,0.4);}
        .card-title {font-size:16px; font-weight:600; margin-bottom:10px; color:#60a5fa;}
        .button-group {display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0;}
        button {padding:12px; border:none; border-radius:10px; font-weight:600; cursor:pointer; background:#475569; color:#94a3b8; transition:0.3s;}
        .active-on {background:#22c55e !important; color:white !important;}
        .active-off {background:#ef4444 !important; color:white !important;}
        .fan-icon {width:60px; height:60px; margin:0 auto 10px; border:3px solid #334155; border-radius:50%; display:block;}
        .spinning {animation:spin 0.8s linear infinite; border-color:#22c55e;}
        @keyframes spin {100% {transform:rotate(360deg);}}
        input[type=range] {width:100%; margin-top:10px; accent-color:#22c55e;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">Smart Home</div>
    
    <div class="card">
        <div id="fanIcon" class="fan-icon"></div>
        <div class="card-title">Fan Control <span id="speedLabel" style="float:right;">50%</span></div>
        <div class="button-group">
            <button id="btnFanOn" onclick="updateState('on')">On</button>
            <button id="btnFanOff" onclick="updateState('off')">Off</button>
        </div>
        <input type="range" id="fanSlider" min="0" max="100" value="50" onchange="handleSliderChange(this.value)">
    </div>

    <div class="card">
        <div class="card-title" id="light1Status">Light 1</div>
        <div class="button-group">
            <button id="btnL1On" onclick="updateState('l1on')">On</button>
            <button id="btnL1Off" onclick="updateState('l1off')">Off</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title" id="light2Status">Light 2</div>
        <div class="button-group">
            <button id="btnL2On" onclick="updateState('l2on')">On</button>
            <button id="btnL2Off" onclick="updateState('l2off')">Off</button>
        </div>
    </div>
</div>

<script>
    // আপনার ESP8266 এর IP অথবা Domain এখানে বসান
    const BASE_URL = "http://YOUR_ESP_IP_OR_DOMAIN"; 
    let currentSpeed = 50;

    async function updateState(action) {
        const res = await fetch(`${BASE_URL}/api/${action}`);
        const data = await res.json();
        updateUI(data);
    }

    async function handleSliderChange(val) {
        let target = parseInt(val);
        let action = target > currentSpeed ? 'up' : 'down';
        await fetch(`${BASE_URL}/api/${action}`);
        currentSpeed = target;
        document.getElementById('speedLabel').textContent = target + '%';
    }

    function updateUI(data) {
        document.getElementById('fanIcon').className = data.fanEnabled ? 'fan-icon spinning' : 'fan-icon';
        document.getElementById('btnFanOn').className = data.fanEnabled ? 'active-on' : '';
        document.getElementById('btnFanOff').className = !data.fanEnabled ? 'active-off' : '';
        document.getElementById('btnL1On').className = data.light1State ? 'active-on' : '';
        document.getElementById('btnL1Off').className = !data.light1State ? 'active-off' : '';
        document.getElementById('btnL2On').className = data.light2State ? 'active-on' : '';
        document.getElementById('btnL2Off').className = !data.light2State ? 'active-off' : '';
    }

    async function longPoll() {
        try {
            const res = await fetch(`${BASE_URL}/api/changed`);
            if (res.ok) {
                const data = await res.json();
                updateUI(data);
            }
        } catch(e) { await new Promise(r => setTimeout(r, 2000)); }
        longPoll();
    }

    window.onload = () => {
        fetch(`${BASE_URL}/api/status`).then(r => r.json()).then(data => {
            updateUI(data);
            longPoll();
        });
    };
</script>
</body>
</html>
