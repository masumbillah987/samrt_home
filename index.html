<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SmarTech BD | Pro Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 20% 30%, #0a0f1c, #02040c);
            color: #fff;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 40% 50%, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowShift 12s infinite alternate;
        }

        @keyframes glowShift {
            0% { opacity: 0.4; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Modern glass card */
        .card {
            background: rgba(18, 25, 45, 0.55);
            backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            padding: 1.6rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(56, 189, 248, 0.1);
        }

        .card:hover {
            transform: translateY(-3px);
            background: rgba(20, 30, 55, 0.65);
            border-color: rgba(56, 189, 248, 0.25);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.6);
        }

        /* Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            padding: 0 0.2rem;
        }

        .brand-center {
            text-align: center;
        }

        .brand-center h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #b0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
        }

        .pro-badge {
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.25);
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            color: #7dd3fc;
            display: inline-block;
            letter-spacing: 0.6px;
            backdrop-filter: blur(4px);
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .icon-btn {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .icon-btn:active {
            transform: scale(0.96);
        }

        .login-header-btn {
            background: linear-gradient(105deg, rgba(245, 158, 11, 0.9), rgba(217, 119, 6, 0.9));
            border: none;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        .logout-btn {
            background: linear-gradient(105deg, rgba(239, 68, 68, 0.9), rgba(185, 28, 28, 0.9));
            border: none;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        /* Card Titles */
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #b9e6ff;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-left: 4px solid #38bdf8;
            padding-left: 0.9rem;
            letter-spacing: -0.2px;
        }

        /* Fan */
        .fan-container {
            display: flex;
            justify-content: center;
            margin: 1.2rem 0;
        }

        .fan-icon {
            width: 100px;
            height: 100px;
            fill: #4b5563;
            transition: all 0.2s;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
        }

        .spinning {
            animation: spinFan 0.6s linear infinite;
            fill: #22c55e !important;
            filter: drop-shadow(0 0 12px #22c55e);
        }

        @keyframes spinFan {
            100% { transform: rotate(360deg); }
        }

        .status-text {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            background: rgba(15, 23, 42, 0.7);
            padding: 0.4rem 1rem;
            border-radius: 3rem;
            display: inline-block;
            width: auto;
            margin: 0.5rem auto;
            backdrop-filter: blur(4px);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin: 1.2rem 0 0.6rem;
        }

        .ctrl-btn {
            padding: 0.8rem;
            border-radius: 3rem;
            font-weight: 700;
            background: #2d3a4e;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:active {
            transform: scale(0.96);
        }

        .active-on {
            background: #22c55e !important;
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.5);
        }

        .active-off {
            background: #ef4444 !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* Slider */
        .slider-container {
            margin-top: 0.9rem;
            padding: 0.3rem 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            border-radius: 10px;
            background: #2d3a4e;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #22c55e;
            cursor: pointer;
            box-shadow: 0 0 8px #22c55e;
            border: 2px solid white;
            transition: 0.1s;
        }

        /* Lights */
        .light-item {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            margin-top: 0.9rem;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            transition: all 0.2s;
        }

        .light-item:hover {
            background: rgba(25, 35, 60, 0.7);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .light-label {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .light-glow {
            color: #fbbf24;
            text-shadow: 0 0 8px #f59e0b;
        }

        /* Server Status */
        .server-status {
            text-align: center;
            font-size: 0.75rem;
            padding: 0.7rem;
            margin-top: 0.8rem;
            border-radius: 3rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-weight: 500;
        }

        .status-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.8s infinite;
        }

        .badge-online {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .badge-offline {
            background: #ef4444;
        }

        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .login-modal {
            background: rgba(12, 20, 35, 0.96);
            border-radius: 2rem;
            padding: 2rem;
            width: calc(100% - 40px);
            max-width: 380px;
            backdrop-filter: blur(24px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            from { transform: scale(0.94); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .login-modal .header {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            text-align: center;
            background: linear-gradient(135deg, #fef08a, #fcd34d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .form-group {
            margin-bottom: 1.3rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
            margin-left: 0.5rem;
        }

        .login-modal input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #2d3a4e;
            border-radius: 2rem;
            font-size: 0.9rem;
            color: white;
            transition: 0.2s;
        }

        .login-modal input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .modal-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .modal-buttons button {
            flex: 1;
            padding: 0.75rem;
            border-radius: 2rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .modal-login-btn {
            background: linear-gradient(95deg, #f59e0b, #d97706);
            color: white;
        }

        .modal-cancel-btn {
            background: #334155;
            color: white;
        }

        /* Toast */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #facc15;
            padding: 0.7rem 1.8rem;
            border-radius: 3rem;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1100;
            backdrop-filter: blur(16px);
            border-left: 4px solid #facc15;
            pointer-events: none;
            animation: toastFade 2.5s ease forwards;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            body { padding: 16px; }
            .card { padding: 1.2rem; }
            .brand-center h1 { font-size: 1.5rem; }
            .icon-btn { padding: 0.4rem 0.9rem; font-size: 0.7rem; }
            .fan-icon { width: 75px; height: 75px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="dashboardView">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="header-left" style="flex:1;"></div>
            <div class="brand-center">
                <h1>SmarTech BD</h1>
                <div class="pro-badge">pro control</div>
            </div>
            <div class="action-buttons">
                <button class="icon-btn login-header-btn" id="showLoginBtn">🔐 Login</button>
            </div>
        </div>

        <!-- Fan Card -->
        <div class="card">
            <div class="card-title">🌀 Fan Commander</div>
            <div class="fan-container">
                <svg id="fanIcon" class="fan-icon" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="7" fill="white"/>
                    <path d="M50 10 Q70 30 50 50 Q30 30 50 10"/>
                    <path d="M90 50 Q70 70 50 50 Q70 30 90 50"/>
                    <path d="M50 90 Q30 70 50 50 Q70 70 50 90"/>
                    <path d="M10 50 Q30 30 50 50 Q30 70 10 50"/>
                </svg>
            </div>
            <div class="status-text" id="fanStatusText">⏹️ Fan is OFF</div>
            <div class="button-group">
                <button class="ctrl-btn" id="fanOnBtn" disabled>🟢 TURN ON</button>
                <button class="ctrl-btn active-off" id="fanOffBtn" disabled>🔴 TURN OFF</button>
            </div>
            <div class="slider-container">
                <div class="slider-label"><span>🌀 Rotation Speed</span><span id="speedPercent">50%</span></div>
                <input type="range" id="fanSpeedSlider" min="0" max="100" value="50" disabled>
            </div>
        </div>

        <!-- Lights Card -->
        <div class="card">
            <div class="card-title">💡 Illumination Hub</div>
            <div class="light-item">
                <div class="light-label" id="light1Label">💡 Light 1 : OFF</div>
                <div class="button-group">
                    <button class="ctrl-btn" id="light1OnBtn" disabled>ON</button>
                    <button class="ctrl-btn active-off" id="light1OffBtn" disabled>OFF</button>
                </div>
            </div>
            <div class="light-item">
                <div class="light-label" id="light2Label">💡 Light 2 : OFF</div>
                <div class="button-group">
                    <button class="ctrl-btn" id="light2OnBtn" disabled>ON</button>
                    <button class="ctrl-btn active-off" id="light2OffBtn" disabled>OFF</button>
                </div>
            </div>
        </div>

        <!-- Server Status -->
        <div class="server-status" id="serverStatus">
            <span class="status-badge badge-offline" id="statusLed"></span>
            <span id="statusMessage">🔐 Secure gateway offline</span>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
    <div class="login-modal">
        <div class="header">🔐 Secure Access</div>
        <div class="subhead" style="text-align: center; font-size: 0.8rem; margin-bottom: 1.5rem; color: #9ca3af;">Enter your credentials</div>
        <div class="form-group">
            <label>👤 User ID</label>
            <input type="text" id="modalUserId" placeholder="Your User ID" autocomplete="off">
        </div>
        <div class="form-group">
            <label>🔒 Password</label>
            <input type="text" id="modalPassword" placeholder="Password" autocomplete="off">
        </div>
        <div class="modal-buttons">
            <button class="modal-cancel-btn" id="cancelLoginBtn">Cancel</button>
            <button class="modal-login-btn" id="confirmLoginBtn">Connect</button>
        </div>
    </div>
</div>

<script>
    // ======================= MQTT & STATE =======================
    let mqttClient = null;
    let isConnected = false;
    let reconnectTimer = null;
    let currentState = {
        fanEnabled: false,
        fanSpeed: 50,
        light1State: false,
        light2State: false
    };
    let runtimeTopics = { statusTopic: "", controlTopic: "" };

    // DOM elements
    const showLoginBtn = document.getElementById('showLoginBtn');
    const loginModal = document.getElementById('loginModal');
    const modalUserId = document.getElementById('modalUserId');
    const modalPassword = document.getElementById('modalPassword');
    const confirmLoginBtn = document.getElementById('confirmLoginBtn');
    const cancelLoginBtn = document.getElementById('cancelLoginBtn');

    const fanOnBtn = document.getElementById('fanOnBtn');
    const fanOffBtn = document.getElementById('fanOffBtn');
    const fanSlider = document.getElementById('fanSpeedSlider');
    const light1On = document.getElementById('light1OnBtn');
    const light1Off = document.getElementById('light1OffBtn');
    const light2On = document.getElementById('light2OnBtn');
    const light2Off = document.getElementById('light2OffBtn');

    function showMessage(text, isError = false, duration = 2500) {
        const toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.textContent = text;
        toast.style.borderLeftColor = isError ? '#ef4444' : '#22c55e';
        toast.style.color = isError ? '#fecaca' : '#bef264';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), duration);
    }

    function updateDashboardUI() {
        const fanIcon = document.getElementById('fanIcon');
        const fanStatusSpan = document.getElementById('fanStatusText');
        if (currentState.fanEnabled) {
            fanIcon.classList.add('spinning');
            fanStatusSpan.innerHTML = '🌀 Fan is RUNNING';
            fanOnBtn.classList.add('active-on');
            fanOffBtn.classList.remove('active-off');
            fanSlider.disabled = false;
        } else {
            fanIcon.classList.remove('spinning');
            fanStatusSpan.innerHTML = '⏹️ Fan is OFF';
            fanOnBtn.classList.remove('active-on');
            fanOffBtn.classList.add('active-off');
            fanSlider.disabled = true;
        }
        fanSlider.value = currentState.fanSpeed;
        document.getElementById('speedPercent').innerText = currentState.fanSpeed + '%';

        const l1label = document.getElementById('light1Label');
        if (currentState.light1State) {
            l1label.innerHTML = '💡 Light 1 : ON ✨';
            l1label.classList.add('light-glow');
            light1On.classList.add('active-on');
            light1Off.classList.remove('active-off');
        } else {
            l1label.innerHTML = '💡 Light 1 : OFF';
            l1label.classList.remove('light-glow');
            light1On.classList.remove('active-on');
            light1Off.classList.add('active-off');
        }

        const l2label = document.getElementById('light2Label');
        if (currentState.light2State) {
            l2label.innerHTML = '💡 Light 2 : ON ✨';
            l2label.classList.add('light-glow');
            light2On.classList.add('active-on');
            light2Off.classList.remove('active-off');
        } else {
            l2label.innerHTML = '💡 Light 2 : OFF';
            l2label.classList.remove('light-glow');
            light2On.classList.remove('active-on');
            light2Off.classList.add('active-off');
        }
    }

    function enableControls(enabled) {
        const btns = [fanOnBtn, fanOffBtn, light1On, light1Off, light2On, light2Off];
        btns.forEach(btn => { if(btn) btn.disabled = !enabled; });
        if (enabled && currentState.fanEnabled) fanSlider.disabled = false;
        else if (!enabled) fanSlider.disabled = true;

        const loginHeaderBtn = document.getElementById('showLoginBtn');
        if (enabled) {
            loginHeaderBtn.textContent = "🚪 Logout";
            loginHeaderBtn.classList.remove('login-header-btn');
            loginHeaderBtn.classList.add('logout-btn');
            loginHeaderBtn.onclick = () => performLogout();
        } else {
            loginHeaderBtn.textContent = "🔐 Login";
            loginHeaderBtn.classList.remove('logout-btn');
            loginHeaderBtn.classList.add('login-header-btn');
            loginHeaderBtn.onclick = () => { loginModal.classList.add('active'); };
        }
    }

    function updateServerStatus(online, msg) {
        const led = document.getElementById('statusLed');
        const statusSpan = document.getElementById('statusMessage');
        if (online) {
            led.className = 'status-badge badge-online';
            statusSpan.innerText = msg || '🟢 Secure link active';
        } else {
            led.className = 'status-badge badge-offline';
            statusSpan.innerText = msg || '🔐 Gateway offline';
        }
    }

    function onMessageArrived(message) {
        try {
            const payload = message.payloadString;
            if (payload.startsWith('{')) {
                const data = JSON.parse(payload);
                let changed = false;
                if (typeof data.fanEnabled !== 'undefined') { currentState.fanEnabled = data.fanEnabled; changed = true; }
                if (typeof data.fanSpeed !== 'undefined') { currentState.fanSpeed = data.fanSpeed; changed = true; }
                if (typeof data.light1State !== 'undefined') { currentState.light1State = data.light1State; changed = true; }
                if (typeof data.light2State !== 'undefined') { currentState.light2State = data.light2State; changed = true; }
                if (changed) {
                    updateDashboardUI();
                    localStorage.setItem('deviceState', JSON.stringify(currentState));
                }
            }
        } catch(e) { console.warn(e); }
    }

    function onConnectionLost() {
        isConnected = false;
        updateServerStatus(false, '🔴 Connection lost');
        enableControls(false);
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
            if (runtimeTopics.statusTopic && runtimeTopics.controlTopic) establishConnection();
        }, 4000);
    }

    function sendCommand(cmd) {
        if (!mqttClient || !isConnected) {
            showMessage("Not connected. Please login.", true);
            return false;
        }
        try {
            let msg = new Paho.MQTT.Message(cmd);
            msg.destinationName = runtimeTopics.controlTopic;
            mqttClient.send(msg);
            return true;
        } catch(e) { return false; }
    }

    function establishConnection() {
        if (!runtimeTopics.statusTopic || !runtimeTopics.controlTopic) return;
        if (mqttClient) {
            try { mqttClient.disconnect(); } catch(e) {}
            mqttClient = null;
        }
        const clientId = "ctrl_" + Math.random().toString(36).substring(2, 10);
        mqttClient = new Paho.MQTT.Client("broker.hivemq.com", 8884, clientId);
        mqttClient.onMessageArrived = onMessageArrived;
        mqttClient.onConnectionLost = onConnectionLost;

        mqttClient.connect({
            useSSL: true,
            timeout: 8,
            onSuccess: () => {
                isConnected = true;
                updateServerStatus(true, '🟢 Secure link active');
                mqttClient.subscribe(runtimeTopics.statusTopic, { qos: 0 });
                sendCommand("REFRESH_STATE");
                sendCommand("GET_STATUS");
                showMessage("✅ Device state synchronized", false);
                enableControls(true);
                updateDashboardUI();
            },
            onFailure: (err) => {
                console.warn(err);
                isConnected = false;
                updateServerStatus(false, '🔴 Connection failed');
                enableControls(false);
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(() => establishConnection(), 5000);
            }
        });
    }

    function saveLoginCredentials(userId, password) {
        localStorage.setItem('smartHomeUserId', userId);
        localStorage.setItem('smartHomePassword', password);
    }

    function clearSavedCredentials() {
        localStorage.removeItem('smartHomeUserId');
        localStorage.removeItem('smartHomePassword');
        localStorage.removeItem('deviceState');
    }

    function loadSavedCredentials() {
        const userId = localStorage.getItem('smartHomeUserId');
        const pwd = localStorage.getItem('smartHomePassword');
        if (userId && pwd) {
            modalUserId.value = userId;
            modalPassword.value = pwd;
            return { userId, pwd };
        }
        return null;
    }

    function loadDeviceState() {
        const savedState = localStorage.getItem('deviceState');
        if (savedState) {
            try {
                const parsed = JSON.parse(savedState);
                currentState = { ...currentState, ...parsed };
                updateDashboardUI();
            } catch(e) {}
        }
    }

    function performLogin() {
        const userId = modalUserId.value.trim();
        const pwd = modalPassword.value.trim();
        if (!userId || !pwd) {
            showMessage("Please enter User ID and Password", true);
            return;
        }
        runtimeTopics.statusTopic = userId;
        runtimeTopics.controlTopic = pwd;
        saveLoginCredentials(userId, pwd);
        loginModal.classList.remove('active');
        showMessage("Connecting to secure gateway...", false);
        if (mqttClient) { try { mqttClient.disconnect(); } catch(e) {} }
        mqttClient = null;
        isConnected = false;
        enableControls(false);
        updateServerStatus(false, '🔄 Connecting...');
        establishConnection();
    }

    function performLogout() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        if (mqttClient && mqttClient.isConnected()) {
            try { mqttClient.disconnect(); } catch(e) {}
        }
        mqttClient = null;
        isConnected = false;
        runtimeTopics = { statusTopic: "", controlTopic: "" };
        enableControls(false);
        updateServerStatus(false, '🔐 Gateway offline');
        currentState = { fanEnabled: false, fanSpeed: 50, light1State: false, light2State: false };
        updateDashboardUI();
        clearSavedCredentials();
        showMessage("Logged out successfully", false);
    }

    function attemptAutoLogin() {
        const saved = loadSavedCredentials();
        if (saved) {
            runtimeTopics.statusTopic = saved.userId;
            runtimeTopics.controlTopic = saved.pwd;
            establishConnection();
        } else {
            enableControls(false);
            updateServerStatus(false, '🔐 Secure gateway ready');
        }
    }

    function attachControlEvents() {
        fanOnBtn.onclick = () => { sendCommand('FAN_ON'); showMessage("Fan ON requested"); };
        fanOffBtn.onclick = () => { sendCommand('FAN_OFF'); showMessage("Fan OFF requested"); };
        fanSlider.onchange = (e) => { sendCommand('SPEED_' + e.target.value); showMessage(`Speed ${e.target.value}%`); };
        light1On.onclick = () => { sendCommand('L1_ON'); showMessage("Light 1 ON"); };
        light1Off.onclick = () => { sendCommand('L1_OFF'); showMessage("Light 1 OFF"); };
        light2On.onclick = () => { sendCommand('L2_ON'); showMessage("Light 2 ON"); };
        light2Off.onclick = () => { sendCommand('L2_OFF'); showMessage("Light 2 OFF"); };
        fanSlider.oninput = (e) => { document.getElementById('speedPercent').innerText = e.target.value + '%'; };
    }

    showLoginBtn.onclick = () => { loginModal.classList.add('active'); };
    cancelLoginBtn.onclick = () => { loginModal.classList.remove('active'); };
    confirmLoginBtn.onclick = performLogin;
    loginModal.onclick = (e) => { if (e.target === loginModal) loginModal.classList.remove('active'); };

    window.addEventListener('load', () => {
        attachControlEvents();
        loadDeviceState();
        updateDashboardUI();
        attemptAutoLogin();
    });
</script>
</body>
</html>
