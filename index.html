<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport optimized for mobile app behavior -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Home Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --on: #22c55e; --off: #ef4444; }
        * { margin:0; padding:0; box-sizing:border-box; }
        
        html, body { 
            width: 100%; height: 100%; 
            overscroll-behavior: none; /* Prevents rubber-band bounce */
            -webkit-user-select: none; user-select: none; /* Prevents text selection */
            background: var(--bg); color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: fixed; overflow: hidden;
        }
        
        .container, .login-container { 
            width: 100%; height: 100%; padding: 15px; overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }

        button { 
            touch-action: manipulation; /* Removes 300ms tap delay */
            padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
            background: #334155; color: white; transition: 0.2s;
        }
        button:active { transform: scale(0.96); filter: brightness(0.9); }
        
        /* Slider Optimization */
        input[type=range] { height: 28px; accent-color: var(--accent); }
        input[type=range]::-webkit-slider-thumb { width: 28px; height: 28px; border-radius: 50%; background: #22c55e; }

        .active-on { background: var(--on) !important; }
        .active-off { background: var(--off) !important; }

        /* Existing component styles remain untouched as requested */
        .card { background: var(--card); padding: 15px; border-radius: 14px; margin-bottom: 10px; }
        .header { text-align: center; font-size: 24px; font-weight: bold; margin: 15px 0; }
        .login-page, .dashboard-page { display: none; height: 100%; width: 100%; flex-direction: column; }
        .active { display: flex; }
        .hidden { display: none; }
        .fan-icon { width: 70px; height: 70px; fill: #475569; }
        .spinning { animation: spin 0.8s linear infinite; fill: var(--on) !important; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- CONTENT REMAINS UNTOUCHED AS REQUESTED -->
<div class="login-page active" id="loginPage">
    <div class="login-container">
        <h1 class="header">🔐 Smart Home</h1>
        <div class="card">
            <div class="login-form">
                <input type="text" id="statusTopic" placeholder="Status Topic">
                <input type="text" id="controlTopic" placeholder="Control Topic" style="margin-top:10px">
                <button class="login-btn" onclick="connectMQTT()" style="margin-top:10px">Connect</button>
            </div>
        </div>
    </div>
</div>

<div class="dashboard-page" id="dashboardPage">
    <div class="header-row" style="padding:15px">
        <h1 class="header">⚙️ Smart Home</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div style="padding:15px">
        <!-- Fan and Light components here -->
    </div>
</div>

<script>
    // Prevent zoom and pinch gestures
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    // ... (Keep all your existing Paho MQTT logic and functions exactly as they are) ...
</script>
</body>
</html>
