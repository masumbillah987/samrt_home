<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Smart Home Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --on: #22c55e; --off: #ef4444; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 15px; }
        .container { width: 100%; max-width: 400px; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 15px; }
        .title { font-weight: 600; color: #60a5fa; margin-bottom: 10px; display: flex; justify-content: space-between; }
        button { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #94a3b8; background: #334155; transition: 0.3s; }
        .active-on { background: var(--on) !important; color: white !important; box-shadow: 0 0 15px rgba(34,197,94,0.4); }
        .active-off { background: var(--off) !important; color: white !important; box-shadow: 0 0 15px rgba(239,68,68,0.4); }
        input[type=range] { width: 100%; accent-color: var(--on); margin-top: 10px; }
        .fan-icon { width: 60px; height: 60px; margin: 0 auto 10px; border: 3px solid #334155; border-radius: 50%; }
        .spinning { animation: spin 2s linear infinite; border-color: var(--on); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center;">Smart Home</h2>
    <div id="connStatus" style="text-align:center; font-size:12px; margin-bottom:15px; color:#94a3b8;">Connecting...</div>

    <div class="card">
        <div id="fan-icon" class="fan-icon"></div>
        <div class="title">Fan Control <span id="speedVal">50%</span></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button id="btnFanOn" onclick="sendMQTT('FAN_ON')">ON</button>
            <button id="btnFanOff" onclick="sendMQTT('FAN_OFF')">OFF</button>
        </div>
        <input type="range" id="fanSlider" min="0" max="100" value="50" oninput="updateSliderLabel(this.value)" onchange="sendSpeed(this.value)">
    </div>

    <div class="card">
        <div class="title">Light 1</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button id="btnL1On" onclick="sendMQTT('L1_ON')">ON</button>
            <button id="btnL1Off" onclick="sendMQTT('L1_OFF')">OFF</button>
        </div>
    </div>

    <div class="card">
        <div class="title">Light 2</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button id="btnL2On" onclick="sendMQTT('L2_ON')">ON</button>
            <button id="btnL2Off" onclick="sendMQTT('L2_OFF')">OFF</button>
        </div>
    </div>
</div>

<script>
    // HiveMQ SSL পোর্ট 8884
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + Math.random().toString(16).substr(2,8));

    client.onMessageArrived = (msg) => {
        const d = JSON.parse(msg.payloadString);
        
        // UI আপডেট
        document.getElementById("fan-icon").className = d.fanEnabled ? "fan-icon spinning" : "fan-icon";
        document.getElementById("btnFanOn").className = d.fanEnabled ? "active-on" : "";
        document.getElementById("btnFanOff").className = !d.fanEnabled ? "active-off" : "";
        document.getElementById("btnL1On").className = d.light1State ? "active-on" : "";
        document.getElementById("btnL1Off").className = !d.light1State ? "active-off" : "";
        document.getElementById("btnL2On").className = d.light2State ? "active-on" : "";
        document.getElementById("btnL2Off").className = !d.light2State ? "active-off" : "";
        
        document.getElementById("fanSlider").value = d.fanSpeed;
        document.getElementById("speedVal").textContent = d.fanSpeed + "%";
    };

    client.connect({ useSSL: true, onSuccess: () => {
        document.getElementById("connStatus").textContent = "● ONLINE (GLOBAL)";
        client.subscribe("myuniquehome/status");
    }});

    function sendMQTT(cmd) {
        let msg = new Paho.MQTT.Message(cmd);
        msg.destinationName = "myuniquehome/control";
        client.send(msg);
    }

    function updateSliderLabel(val) { document.getElementById("speedVal").textContent = val + "%"; }

    function sendSpeed(val) {
        // ESP8266 এ FAN_UP/DOWN লজিক থাকলে সেই অনুযায়ী কমান্ড পাঠান
        // অথবা যদি ESP সরাসরি স্পিড ভ্যালু সাপোর্ট করে তবে 'SPEED_' + val পাঠান
        sendMQTT(val > 50 ? 'FAN_UP' : 'FAN_DOWN');
    }
</script>
</body>
</html>
